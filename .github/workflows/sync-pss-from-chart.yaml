# Keeps pod-security-vpol aligned with the Pod Security Standards policies of the
# kyverno-policies chart in kyverno/kyverno. See .hack/pss-sync/README.md.
name: Sync PSS policies from the chart

permissions: {}

on:
  schedule:
    - cron: '23 5 * * *'
  # kyverno/kyverno can send this event after a chart change.
  repository_dispatch:
    types: [pss-chart-changed]
  workflow_dispatch:
    inputs:
      publish:
        description: Open or update the pull request and the tracking issue
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BRANCH: automation/sync-pss-from-chart
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  # Hidden marker that identifies the tracking issue.
  ISSUE_MARKER: '<!-- pss-sync -->'

jobs:
  sync:
    # Scheduled runs only in kyverno/policies. Forks can still run it by hand.
    if: github.repository == 'kyverno/policies' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      # Pull requests need the PSS_SYNC_PUBLISH repository variable, or publish on a manual run.
      PUBLISH_PR: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name != 'workflow_dispatch' && vars.PSS_SYNC_PUBLISH == 'true') }}
      REPORT_ISSUE: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policies
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Kyverno
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kyverno/kyverno
          ref: main
          path: kyverno
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: kyverno/go.mod
          cache-dependency-path: |
            kyverno/go.sum
            policies/.hack/pss-sync/go.sum
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Same version as kyverno/kyverno's chart checks.
          version: v3.19.0
      - name: Build the Kyverno CLI
        working-directory: kyverno
        run: go build -o "${RUNNER_TEMP}/kyverno" ./cmd/cli/kubectl-kyverno
      - name: Sync
        id: sync
        working-directory: policies
        env:
          KYVERNO: ${{ runner.temp }}/kyverno
        run: |
          rc=0
          ./.hack/pss-sync/sync.sh --kyverno-dir ../kyverno --write --report "${RUNNER_TEMP}/report.md" || rc=$?
          cat "${RUNNER_TEMP}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${rc}" -ne 0 ]; then
            echo "result=error" >> "${GITHUB_OUTPUT}"
            exit "${rc}"
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "result=update" >> "${GITHUB_OUTPUT}"
          else
            echo "result=in-sync" >> "${GITHUB_OUTPUT}"
          fi
      # The pull request action resets the branch, so never run it over someone else's commits.
      - name: Check the bot branch
        id: branch
        if: env.PUBLISH_PR == 'true'
        working-directory: policies
        run: |
          if ! git ls-remote --exit-code --heads origin "${BRANCH}" > /dev/null; then
            echo "owned=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git fetch --quiet origin "${BRANCH}"
          others="$(git log --format='%ae%n%ce' origin/main..FETCH_HEAD | sort -u | grep -vxF "${BOT_EMAIL}" || true)"
          if [ -n "${others}" ]; then
            echo "::warning::${BRANCH} has commits by ${others//$'\n'/, }. The sync doesn't update it until they're removed or the branch is merged or deleted."
            echo "owned=false" >> "${GITHUB_OUTPUT}"
          else
            echo "owned=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Write the pull request body
        if: env.PUBLISH_PR == 'true' && steps.branch.outputs.owned == 'true'
        run: |
          {
            echo "This pull request updates the \`pod-security-vpol\` allow-lists to match the Pod Security Standards policies of the \`kyverno-policies\` chart."
            echo "The sync workflow checked the result against upstream Pod Security Admission and ran the \`pod-security-vpol\` tests."
            echo
            cat "${RUNNER_TEMP}/report.md"
            echo
            echo "Generated by [${GITHUB_WORKFLOW}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). See \`.hack/pss-sync/README.md\`."
          } > "${RUNNER_TEMP}/pr-body.md"
      # With no changes, this deletes the bot branch, which closes a pull request that is no longer needed.
      - name: Create or update the pull request
        id: pr
        if: env.PUBLISH_PR == 'true' && steps.branch.outputs.owned == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PR_UPDATE_TOKEN }}
          path: policies
          base: main
          branch: ${{ env.BRANCH }}
          delete-branch: true
          add-paths: pod-security-vpol
          author: ${{ env.BOT_NAME }} <${{ env.BOT_EMAIL }}>
          committer: ${{ env.BOT_NAME }} <${{ env.BOT_EMAIL }}>
          signoff: true
          commit-message: 'chore(pss): sync pod-security-vpol allow-lists with the kyverno-policies chart'
          title: 'chore(pss): sync pod-security-vpol allow-lists with the kyverno-policies chart'
          body-path: ${{ runner.temp }}/pr-body.md
      - name: Update the tracking issue
        if: always() && env.REPORT_ISSUE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.sync.outputs.result || 'error' }}
          PR_UPDATED: ${{ steps.pr.outcome == 'success' }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue="$(gh issue list --state open --author app/github-actions --limit 100 --json number,body \
            --jq "[.[] | select(.body | contains(\"${ISSUE_MARKER}\"))][0].number // empty")"
          # The issue stays open until the policies are in sync or a sync pull request is up to date.
          if [ "${RESULT}" = in-sync ] || { [ "${RESULT}" = update ] && [ "${PR_UPDATED}" = true ]; }; then
            if [ -n "${issue}" ]; then
              gh issue close "${issue}" --comment "The policies are in sync with the chart again, or a sync pull request is open: ${run_url}"
            fi
            exit 0
          fi
          {
            echo "${ISSUE_MARKER}"
            if [ "${RESULT}" = update ] && [ "${PUBLISH_PR}" != true ]; then
              echo "The chart changed allow-lists that the sync can update. Publishing is off, so no pull request was opened."
            elif [ "${RESULT}" = update ]; then
              echo "The chart changed allow-lists that the sync can update, but the sync pull request wasn't updated. The bot branch may have commits by someone else. See the run log."
            else
              echo "The sync can't update \`pod-security-vpol\` automatically. A maintainer needs to update the policies by hand, or fix the chart."
            fi
            echo
            echo "Latest run: ${run_url}"
            echo
            cat "${RUNNER_TEMP}/report.md" 2> /dev/null || echo "The sync failed before it wrote a report. See the run log."
          } > "${RUNNER_TEMP}/issue.md"
          if [ -n "${issue}" ]; then
            gh issue edit "${issue}" --body-file "${RUNNER_TEMP}/issue.md"
          else
            gh issue create --title "Pod Security Standards policies are out of sync with the kyverno-policies chart" --body-file "${RUNNER_TEMP}/issue.md"
          fi
