apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-probes
  annotations:
    policies.kyverno.io/title: Disallow Host Probes in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Baseline) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.34+"
    policies.kyverno.io/description: >-
      Probes and lifecycle handlers that set a `host` let a Pod direct the kubelet to make requests
      to arbitrary addresses, including link-local metadata endpoints. This policy ensures the
      `httpGet.host` and `tcpSocket.host` fields of every probe and lifecycle handler are unset or
      empty. It implements the `hostProbesAndHostLifecycle` check that Kubernetes added to the
      Baseline profile in v1.34.
      Set the `psaMinor` variable to match an earlier Kubernetes Pod Security Admission version,
      for example 30 for v1.30. The default matches the newest version.
spec:
  validationActions:
     - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  variables:
    # Pod Security Admission minor version to match, for example 30 for v1.30.
    - name: psaMinor
      expression: "29"
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    # Pod Security Admission added this check in v1.34.
    - expression: >-
        variables.psaMinor < 34 ||
        variables.allContainers.all(container,
          container.?livenessProbe.?httpGet.?host.orValue('') == '' &&
          container.?livenessProbe.?tcpSocket.?host.orValue('') == '' &&
          container.?readinessProbe.?httpGet.?host.orValue('') == '' &&
          container.?readinessProbe.?tcpSocket.?host.orValue('') == '' &&
          container.?startupProbe.?httpGet.?host.orValue('') == '' &&
          container.?startupProbe.?tcpSocket.?host.orValue('') == '' &&
          container.?lifecycle.?postStart.?httpGet.?host.orValue('') == '' &&
          container.?lifecycle.?postStart.?tcpSocket.?host.orValue('') == '' &&
          container.?lifecycle.?preStop.?httpGet.?host.orValue('') == '' &&
          container.?lifecycle.?preStop.?tcpSocket.?host.orValue('') == '')
      message: >-
        Probes and lifecycle handlers must not set a host. The fields httpGet.host and
        tcpSocket.host of livenessProbe, readinessProbe, startupProbe, lifecycle.postStart, and
        lifecycle.preStop must be unset or empty in spec.containers[*], spec.initContainers[*], and
        spec.ephemeralContainers[*].
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-proc-mount
  annotations:
    policies.kyverno.io/title: Disallow procMount in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Baseline) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.30+"
    policies.kyverno.io/description: >-
      The default /proc masks are set up to reduce attack surface and should be required. This
      policy ensures nothing but the default procMount can be specified. Pods that set
      `spec.hostUsers: false` are exempt, as in Pod Security Standards v1.35 and later. Pod
      Security Admission on earlier Kubernetes versions does not exempt them. The API server
      accepts a procMount of `Unmasked` only when `spec.hostUsers` is `false`, and only with
      the `ProcMountType` feature gate, which is on by default from Kubernetes 1.33.
      Set the `psaMinor` variable to match an earlier Kubernetes Pod Security Admission version,
      for example 30 for v1.30. The default matches the newest version.
spec:
  validationActions:
     - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  variables:
    # Pod Security Admission minor version to match, for example 30 for v1.30.
    - name: psaMinor
      expression: "29"
    - name: allContainers
      expression: >-
        object.spec.containers +
          object.spec.?initContainers.orValue([]) +
          object.spec.?ephemeralContainers.orValue([])
    # Pod Security Admission exempts user namespace Pods from v1.35.
    - name: userNamespacePod
      expression: "variables.psaMinor >= 35 && object.spec.?hostUsers.orValue(true) == false"
  validations:
    - expression: >-
        variables.userNamespacePod ||
        variables.allContainers.all(container,
          container.?securityContext.?procMount.orValue('Default') == 'Default')
      message: >-
        Changing the proc mount from the default is not allowed, unless the Pod sets
        spec.hostUsers to `false`.
      messageExpression: >-
        'Changing the proc mount from the default is not allowed' +
        (variables.psaMinor >= 35 ? ', unless the Pod sets spec.hostUsers to `false`.' : '.')
---
