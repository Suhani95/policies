name: disallow-host-probes-vpol
version: 1.0.0
displayName: Disallow Host Probes in ValidatingPolicy
description: >-
  Probes and lifecycle handlers that set a `host` let a Pod direct the kubelet to make requests to arbitrary addresses, including link-local metadata endpoints. This policy ensures the `httpGet.host` and `tcpSocket.host` fields of every probe and lifecycle handler are unset or empty. It implements the `hostProbesAndHostLifecycle` check that Kubernetes added to the Baseline profile in v1.34. Set the `psaMinor` variable to match an earlier Kubernetes Pod Security Admission version, for example 30 for v1.30. The default matches the newest version.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-host-probes/disallow-host-probes.yaml
  ```
keywords:
  - kyverno
  - Pod Security Standards (Baseline)
  - ValidatingPolicy
readme: |
  Probes and lifecycle handlers that set a `host` let a Pod direct the kubelet to make requests to arbitrary addresses, including link-local metadata endpoints. This policy ensures the `httpGet.host` and `tcpSocket.host` fields of every probe and lifecycle handler are unset or empty. It implements the `hostProbesAndHostLifecycle` check that Kubernetes added to the Baseline profile in v1.34. Set the `psaMinor` variable to match an earlier Kubernetes Pod Security Admission version, for example 30 for v1.30. The default matches the newest version.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Standards (Baseline) in ValidatingPolicy"
  kyverno/kubernetesVersion: "1.34+"
  kyverno/subject: "Pod"
