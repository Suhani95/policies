apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-proc-mount
  annotations:
    policies.kyverno.io/title: Disallow procMount in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Baseline) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.30+"
    policies.kyverno.io/description: >-
      The default /proc masks are set up to reduce attack surface and should be required. This
      policy ensures nothing but the default procMount can be specified. Pods that set
      `spec.hostUsers: false` are exempt, as in Pod Security Standards v1.35 and later. Pod
      Security Admission on earlier Kubernetes versions does not exempt them. The API server
      accepts a procMount of `Unmasked` only when `spec.hostUsers` is `false`, and only with
      the `ProcMountType` feature gate, which is on by default from Kubernetes 1.33.
      Set the `psaMinor` variable to match an earlier Kubernetes Pod Security Admission version,
      for example 30 for v1.30. The default matches the newest version.
spec:
  validationActions:
     - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  variables:
    # Pod Security Admission minor version to match, for example 30 for v1.30.
    - name: psaMinor
      expression: "37"
    - name: allContainers
      expression: >-
        object.spec.containers +
          object.spec.?initContainers.orValue([]) +
          object.spec.?ephemeralContainers.orValue([])
    # Pod Security Admission exempts user namespace Pods from v1.35.
    - name: userNamespacePod
      expression: "variables.psaMinor >= 35 && object.spec.?hostUsers.orValue(true) == false"
  validations:
    - expression: >-
        variables.userNamespacePod ||
        variables.allContainers.all(container,
          container.?securityContext.?procMount.orValue('Default') == 'Default')
      message: >-
        Changing the proc mount from the default is not allowed, unless the Pod sets
        spec.hostUsers to `false`.
      messageExpression: >-
        'Changing the proc mount from the default is not allowed' +
        (variables.psaMinor >= 35 ? ', unless the Pod sets spec.hostUsers to `false`.' : '.')
